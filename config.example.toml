# Copy to a separate profile and replace username and the selected folder paths.
# Never store the app password in this file.
language = "auto" # auto, en, de
server = "https://jmap.example.com"
web_url = "https://mail.example.com"
username = "user@example.org"
auth_mode = "app_password" # app_password or browser
# Browser sign-in uses Authorization Code + PKCE, never a client secret.
# Default scopes require a server that supports JMAP Files OAuth scopes.
oauth_issuer = "" # Empty: the JMAP server; external IdPs must also be trusted by Stalwart.
oauth_client_id = "" # Empty: public dynamic registration, if supported.
oauth_scopes = "urn:ietf:params:oauth:scope:files offline_access"
oauth_redirect_port = 0 # Ephemeral; use a fixed registered port for providers such as authentik.
# account_id = "your-file-account-id" # Only needed when discovery is ambiguous.
interval_seconds = 30
full_scan_seconds = 900
# Payload limits in KiB/s (1024 bytes/s); zero means unlimited.
upload_limit_kib = 0
download_limit_kib = 0
# A changed file must remain unchanged across observations for this duration.
file_settle_seconds = 2
pause_on_power_saver = true
autostart = false
propagate_deletes = true
max_delete_count = 20
max_delete_percent = 25
# Zero: server-advertised upload limit (1 GiB fallback if not advertised).
# Positive values add a user cap in bytes and also bound downloads.
max_file_bytes = 0
# Clamped to the server's maxConcurrentUpload; unknown server limit means one.
parallel_uploads = 2
# Optional, editable in the UI. An empty list disables these exclusions.
exclude_patterns = ["~$*", "*.tmp", "*.temp", "*.swp", "*.swo", "*~", "*.crdownload", "*.part", "*.partial", "*.download", "desktop.ini", "Thumbs.db", ".DS_Store"]
device_name = "Desktop"

# Each selection uses its own final folder name at the server root. Overlapping roots are rejected.
[[sync_folders]]
local_folder = "/home/user/Desktop" # Windows: 'C:\Users\user\Desktop'

[[sync_folders]]
local_folder = "/home/user/Documents/Büro" # Windows: 'C:\Users\user\Documents\Büro'
# remote_path is derived automatically when omitted; it is not a user-facing option.
