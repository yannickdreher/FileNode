workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages: [verify, release]

default:
  interruptible: true
  image: rust:1-slim-bookworm@sha256:ebd900bae66fd508b466cef82d64a83a5fb34682e4c8b2797a42908bddc95a57
  tags: [docker]

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  CARGO_TARGET_DIR: "$CI_PROJECT_DIR/target"
  CARGO_BUILD_JOBS: "2"

verify-linux:
  stage: verify
  timeout: 1h
  cache:
    key:
      prefix: rust-1.98.1
      files: [Cargo.lock]
    paths: [.cargo/registry/, .cargo/git/]
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends pkg-config libdbus-1-dev cmake ninja-build build-essential qt6-base-dev qt6-declarative-dev qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtquick-layouts qml6-module-qtquick-controls qml6-module-qtquick-dialogs qml6-module-qtquick-templates qml6-module-qtqml qml6-module-qtqml-workerscript libgl1-mesa-dri xvfb xauth dbus-x11 python3-dbus python3-gi openbox imagemagick xdotool wmctrl
    - rustup component add clippy rustfmt rust-src
  script:
    - cargo fmt --all -- --check
    - cargo clippy --locked --all-targets -- -D warnings
    - cargo test --locked --all-targets
    - cargo check --locked --no-default-features
    - sh scripts/build-linux.sh debug
    - DRIVE_UI="$CARGO_TARGET_DIR/debug/noridrive-ui" DRIVE_CORE="$CARGO_TARGET_DIR/debug/noridrive" dbus-run-session -- sh scripts/desktop-smoke.sh
  artifacts:
    when: always
    expire_in: 14 days
    paths: [artifacts/*.png, artifacts/*.log]

verify-release-tools:
  stage: verify
  image: node:24-bookworm-slim
  cache:
    key:
      prefix: release-tools
      files: [package-lock.json]
    paths: [.npm/]
  script:
    - npm ci --ignore-scripts --no-audit --no-fund --cache .npm
    - npm test

# Hold the release lock until the complete child pipeline has finished.
release:
  stage: release
  inherit:
    default: false
  interruptible: false
  resource_group: noridrive-release
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web")'
  trigger:
    include:
      - local: .gitlab/release.yml
    strategy: mirror
