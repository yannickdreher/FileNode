workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages: [build]

default:
  interruptible: true
  image: rust:1-slim-bookworm@sha256:ebd900bae66fd508b466cef82d64a83a5fb34682e4c8b2797a42908bddc95a57
  tags: [docker]

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  CARGO_TARGET_DIR: "$CI_PROJECT_DIR/target"
  CARGO_BUILD_JOBS: "2"
  CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc

test-and-package:
  stage: build
  timeout: 1h
  cache:
    key:
      prefix: rust-1.98.1
      files: [Cargo.lock]
    paths:
      - .cargo/registry/
      - .cargo/git/
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends pkg-config libdbus-1-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libegl1-mesa-dev libgl1-mesa-dri libx11-dev libxi-dev libxcursor-dev libxrandr-dev gcc-mingw-w64-x86-64 zip xvfb xauth dbus-x11 python3-dbus python3-gi openbox imagemagick xdotool
    - rustup component add clippy rustfmt
    - rustup target add x86_64-pc-windows-gnu
    - rustc --version
  script:
    - cargo fmt --all -- --check
    - cargo clippy --locked --all-targets -- -D warnings
    - cargo test --locked --all-targets
    - cargo check --locked --no-default-features
    - cargo build --locked --release
    - dbus-run-session -- sh scripts/desktop-smoke.sh
    - cargo build --locked --release --target x86_64-pc-windows-gnu
    - mkdir -p dist/linux-x86_64 dist/windows-x86_64
    - cp target/release/noritec-drive dist/linux-x86_64/
    - cp target/x86_64-pc-windows-gnu/release/noritec-drive.exe dist/windows-x86_64/
    - cp README.md README.de.md config.example.toml dist/linux-x86_64/
    - cp README.md README.de.md config.example.toml dist/windows-x86_64/
    - tar -czf dist/noritec-drive-linux-x86_64.tar.gz -C dist/linux-x86_64 .
    - cd dist/windows-x86_64 && zip -r ../noritec-drive-windows-x86_64.zip . && cd ../..
    - sha256sum dist/*.tar.gz dist/*.zip > dist/SHA256SUMS
  artifacts:
    name: "noritec-drive-$CI_COMMIT_SHORT_SHA"
    expire_in: 30 days
    when: always
    paths:
      - dist/*.tar.gz
      - dist/*.zip
      - dist/SHA256SUMS
      - artifacts/*.png
