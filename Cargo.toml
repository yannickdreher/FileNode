[package]
name = "filenode"
version = "0.2.2"
edition = "2021"
rust-version = "1.98"
description = "Cross-platform desktop synchronization for Stalwart JMAP Files"
repository = "https://github.com/yannickdreher/FileNode"
publish = false

[features]
default = ["desktop"]
desktop = ["dep:keyring", "dep:winreg"]

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
fs2 = "0.4"
getrandom = "0.4"
globset = "0.4"
hex = "0.4"
notify = "8.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sys-locale = "0.3"
tempfile = "3"
toml = "0.8"
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
unicode-normalization = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
zeroize = "1"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"], optional = true }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_CloudFilters", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_CorrelationVector", "Win32_System_Com", "Win32_System_WinRT", "Win32_System_Threading", "Win32_Security_Authorization", "Storage_Provider", "Storage", "Storage_Search", "Storage_Streams", "Foundation", "Foundation_Collections", "Security_Cryptography", "Win32_Security"] }
winreg = { version = "0.55", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.18", default-features = false }
libc = "0.2"
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"], optional = true }

[dev-dependencies]
proptest = "1"

[profile.release]
lto = "thin"
strip = true
